name: Deploy NCC-ERP-AMS-BE-PROD

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        default: "master"

jobs:
  deploy:
    runs-on: ams-prod
    env:
      APP_DIR: /home/nccsoft/NCC-ITTools
    if: github.event.inputs.branch == 'master'
    steps:
      - name: Backup Database
        run: |
          bash $APP_DIR/backup_db.sh

      - name: Pull latest code
        run: |
          set -e
          cd $APP_DIR
          git fetch origin
          git reset --hard origin/${{ github.event.inputs.branch }}

      - name: Install dependencies
        run: |
          set -e
          cd $APP_DIR
          composer install --no-dev --optimize-autoloader --no-interaction
          php artisan optimize
          php artisan view:clear

      - name: Run database migrations
        id: migration_step
        run: |
          set -e
          cd $APP_DIR
          php artisan migrate --force

      - name: Restart application workers
        run: |
          set -e
          cd $APP_DIR
          php artisan queue:restart

          PHP_FPM_SERVICE="${PHP_FPM_SERVICE:-php8.3-fpm}"
          if command -v systemctl >/dev/null 2>&1 && systemctl list-unit-files "$PHP_FPM_SERVICE.service" --no-legend 2>/dev/null | grep -q "$PHP_FPM_SERVICE.service"; then
            sudo systemctl reload "$PHP_FPM_SERVICE.service"
          elif command -v service >/dev/null 2>&1 && service "$PHP_FPM_SERVICE" status >/dev/null 2>&1; then
            sudo service "$PHP_FPM_SERVICE" reload
          else
            echo "PHP-FPM service '$PHP_FPM_SERVICE' was not found; set PHP_FPM_SERVICE on the runner."
            exit 1
          fi

      - name: Rollback (Restore DB if migration error)
        if: steps.migration_step.outcome == 'failure'
        run: |
          bash $APP_DIR/rollback_db.sh
